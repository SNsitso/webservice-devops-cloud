# 1 réplique : le PVC (disque GCP) est en ReadWriteOnce — un seul nœud
# peut le monter. Passer à 2+ exigerait un stockage ReadWriteMany (Filestore).
replicaCount: 1

image:
  repository: bitnami/wordpress
  tag: latest
  pullPolicy: IfNotPresent

wordpress:
  username: admin
  email: admin@example.com
  title: My WordPress Site
  deployment:
    # Épinglé par digest : depuis 2025-08 Bitnami ne publie plus de tags
    # versionnés gratuits (seul :latest reste). Le digest garantit un
    # déploiement reproductible. Mise à jour volontaire :
    #   docker buildx imagetools inspect bitnami/wordpress:latest
    image: bitnami/wordpress@sha256:4a70606af740f23f5cd8ac86b13e66adffca022526953c68de1307418a1186a8
    replicaCount: 1
  service:
    # ClusterIP (et non LoadBalancer) : le trafic public entre par
    # ingress-nginx — UN seul LoadBalancer GCP pour tous les sites, qui
    # termine le TLS et route par nom d'hôte. Les pods WordPress ne sont
    # plus exposés directement sur Internet.
    type: ClusterIP
    port: 80
    targetPort: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

mysql:
  enabled: false

cloudsql:
  enabled: true
  host: 10.39.128.6
  port: 3306
  database: wordpress
  username: wordpress
  # Secret K8s créé par External Secrets Operator (voir gitops/gke/secrets/)
  # Le mot de passe n'apparaît plus nulle part dans Git ni dans le CI
  existingSecret: wordpress-db

persistence:
  enabled: true
  storageClass: standard
  size: 10Gi
  mountPath: /bitnami/wordpress

env:
  WORDPRESS_TABLE_PREFIX: wp_

ingress:
  enabled: true
  className: nginx
  # Hôte par défaut = prod ; l'Application ArgoCD staging le surcharge via
  # helm.parameters (un seul chart, un hostname par environnement).
  host: prod.wsdevops.ip-ddns.com
  path: /
  annotations:
    # LA ligne qui déclenche tout : cert-manager voit cette annotation,
    # demande un certificat à Let's Encrypt pour les hôtes du bloc tls,
    # résout le challenge HTTP-01, et renouvelle automatiquement.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Redirige http:// vers https:// (comportement par défaut de nginx
    # dès qu'un TLS existe, rendu explicite ici)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    # Secret créé et rempli PAR cert-manager (pas par nous) dans le
    # namespace de l'Ingress — contient le certificat et sa clé privée.
    secretName: wordpress-tls

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  # Requests réduites : les nœuds e2-small (940m/1.3Gi allouables) hébergent
  # aussi ArgoCD + ESO + système GKE. Requests = réservation du scheduler,
  # pas la conso réelle — les limits laissent de la marge d'usage.
  requests:
    cpu: 100m
    memory: 192Mi

affinity: {}
tolerations: []
nodeSelector: {}
