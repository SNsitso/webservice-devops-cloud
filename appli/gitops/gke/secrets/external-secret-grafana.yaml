# =====================
# EXTERNAL SECRET — Grafana admin password
# Lit "grafana-admin-password" dans GCP Secret Manager (via ESO + Workload
# Identity) et crée le Secret K8s "grafana-admin" dans le namespace monitoring.
# Le chart kube-prometheus-stack monte ce Secret via admin.existingSecret.
# =====================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
    # Les clés admin-user/admin-password sont ce qu'attend le chart Grafana
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin-password
